name: Validate data

# Runs on pushes to main and on PRs. Pages deploy also validates before publish.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Validate schema, slugs, injection
        run: npm run validate
      - name: Unit + data integrity tests
        run: npm test
      - name: Build must succeed
        run: npm run build
